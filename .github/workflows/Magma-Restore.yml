name: Run Restore Script

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 */6 * * *' # 示例：每6小时自动运行一次，你可以根据实际情况修改

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      # 1. 正常拉取你当前的公库结构
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # 2. 专门把你的私库代码拉取到一个临时文件夹中
      - name: 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: 'jhub569/MagmaRestore-auto' # 如果私库在其他账号，请把 jhub569 改成那个账号
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: 'temp_private_repo'

      # 3. 创建目录并把 restore.py 挪过去
      - name: 准备运行环境
        run: |
          mkdir -p scripts/screenshots
          cp temp_private_repo/restore.py scripts/restore.py

      # 4. 依赖安装与执行（根据你脚本的实际需要调整）
      - name: 安装 Python 依赖并运行
        run: |
          pip install -r requirements.txt || true # 如果有依赖的话
          python scripts/restore.py
